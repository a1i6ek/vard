# Lint, unit tests, the Go vulnerability check and the compose file, on
# every push and pull request. The integration tests and the apps' package
# audit run locally only: `make ci` runs everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: make deps
      - run: make check

  # A vulnerability published in a dependency (crewjam/saml among them,
  # ADR 0009) fails the build from the day it is known.
  vuln:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make vuln

  deploy:
    name: compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make docker-config
