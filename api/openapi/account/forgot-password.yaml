/api/v1/account/forgot-password:
  post:
    operationId: postAccountForgotPassword
    tags:
    - forgot-password
    summary: Post forgot-password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              email:
                type: string
              language:
                type: string
              request:
                type: string
            required:
            - request
            - email
            - language
            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                status:
                  type: string
              required:
              - status
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
