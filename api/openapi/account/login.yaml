/api/v1/account/login:
  post:
    operationId: postAccountLogin
    tags:
    - login
    summary: Post login
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              email:
                type: string
              password:
                type: string
              remember:
                type: boolean
              request:
                type: string
            required:
            - request
            - email
            - password
            - remember
            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/SignedIn
      default:
        $ref: ../common.yaml#/ProblemResponse
