/api/v1/account/me:
  get:
    operationId: listAccountMe
    tags:
    - me
    summary: Read me
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                user:
                  $ref: ./schemas.yaml#/User
              required:
              - user
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  patch:
    operationId: updateAccountMe
    tags:
    - me
    summary: Update me
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              first_name:
                type: string
              last_name:
                type: string
            required:
            - first_name
            - last_name
            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                user:
                  $ref: ./schemas.yaml#/User
              required:
              - user
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
