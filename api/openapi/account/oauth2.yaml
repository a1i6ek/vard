# The OAuth 2.0 and OpenID Connect endpoints. Their errors are RFC 6749's
# (error, error_description), not problem details, as the standards require.
/oauth2/authorize:
  get:
    operationId: authorize
    tags: [oauth2]
    summary: Start a sign-in (RFC 6749 §4.1.1, PKCE required)
    description: |
      Sends the browser to the sign-in pages, or, signed in already, back to
      the application with a code. A refused request goes back with error and
      state when its redirect_uri is registered, and to the error page
      otherwise.
    parameters:
      - {name: client_id, in: query, required: true, schema: {type: string}}
      - {name: response_type, in: query, required: false, schema: {type: string, enum: [code]}}
      - {name: redirect_uri, in: query, required: false, schema: {type: string}}
      - {name: scope, in: query, required: false, schema: {type: string}}
      - {name: state, in: query, required: false, schema: {type: string}}
      - {name: nonce, in: query, required: false, schema: {type: string}}
      - {name: code_challenge, in: query, required: false, schema: {type: string}}
      - {name: code_challenge_method, in: query, required: false, schema: {type: string, enum: [S256]}}
      - {name: resource, in: query, required: false, schema: {type: string}, description: The API the token is for (RFC 8707).}
      - {name: request_uri, in: query, required: false, schema: {type: string}, description: A pushed request's (RFC 9126).}
      - {name: dpop_jkt, in: query, required: false, schema: {type: string}}
      - {name: prompt, in: query, required: false, schema: {type: string}}
      - {name: max_age, in: query, required: false, schema: {type: integer}}
      - {name: login_hint, in: query, required: false, schema: {type: string}}
      - {name: ui_locales, in: query, required: false, schema: {type: string}}
    responses:
      '302':
        $ref: '../common.yaml#/RedirectResponse'
  post:
    operationId: authorizeByForm
    tags: [oauth2]
    summary: Start a sign-in, the parameters posted (OpenID Connect Core §3.1.2.1)
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema: {type: object, additionalProperties: {type: string}}
    responses:
      '302':
        $ref: '../common.yaml#/RedirectResponse'
/oauth2/token:
  post:
    operationId: token
    tags: [oauth2]
    summary: Issue tokens (RFC 6749 §3.2)
    description: |
      For an authorization code, a refresh token, a device code, client
      credentials or a token exchange (RFC 8693). A client authenticates with
      HTTP Basic, client_secret_post or a client assertion (RFC 7523); a
      DPoP proof (RFC 9449) binds the tokens to its key.
    parameters:
      - {name: DPoP, in: header, required: false, schema: {type: string}}
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [grant_type]
            properties:
              grant_type: {type: string}
              code: {type: string}
              redirect_uri: {type: string}
              code_verifier: {type: string}
              refresh_token: {type: string}
              device_code: {type: string}
              scope: {type: string}
              resource: {type: string}
              client_id: {type: string}
              client_secret: {type: string}
              client_assertion_type: {type: string}
              client_assertion: {type: string}
              subject_token: {type: string}
              subject_token_type: {type: string}
              actor_token: {type: string}
              actor_token_type: {type: string}
              requested_token_type: {type: string}
    responses:
      '200':
        description: The tokens.
        content:
          application/json:
            schema:
              type: object
              required: [access_token, token_type, expires_in, scope]
              properties:
                access_token: {type: string}
                issued_token_type: {type: string}
                token_type: {type: string, enum: [Bearer, DPoP]}
                expires_in: {type: integer}
                refresh_token: {type: string}
                id_token: {type: string}
                scope: {type: string}
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
/oauth2/par:
  post:
    operationId: pushAuthorization
    tags: [oauth2]
    summary: Push an authorization request (RFC 9126)
    parameters:
      - {name: DPoP, in: header, required: false, schema: {type: string}}
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema: {type: object, additionalProperties: {type: string}}
    responses:
      '201':
        description: Where the browser carries it.
        content:
          application/json:
            schema:
              type: object
              required: [request_uri, expires_in]
              properties:
                request_uri: {type: string}
                expires_in: {type: integer}
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
/oauth2/device_authorization:
  post:
    operationId: startDevice
    tags: [oauth2]
    summary: Start a device's sign-in (RFC 8628)
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              client_id: {type: string}
              scope: {type: string}
              resource: {type: string}
    responses:
      '200':
        description: The codes.
        content:
          application/json:
            schema:
              type: object
              required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
              properties:
                device_code: {type: string}
                user_code: {type: string}
                verification_uri: {type: string}
                verification_uri_complete: {type: string}
                expires_in: {type: integer}
                interval: {type: integer}
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
/oauth2/introspect:
  post:
    operationId: introspect
    tags: [oauth2]
    summary: Say whether a token is live (RFC 7662), as JSON or signed (RFC 9701)
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [token]
            properties:
              token: {type: string}
              token_type_hint: {type: string}
    responses:
      '200':
        description: The token's state, and its claims when live.
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: {type: boolean}
              additionalProperties: true
          application/token-introspection+jwt:
            schema: {type: string}
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
/oauth2/revoke:
  post:
    operationId: revoke
    tags: [oauth2]
    summary: Revoke a token (RFC 7009)
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required: [token]
            properties:
              token: {type: string}
              token_type_hint: {type: string}
    responses:
      '200':
        description: Revoked, or never valid.
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
/oauth2/register:
  post:
    operationId: registerClient
    tags: [oauth2]
    summary: Register a client (RFC 7591), with an initial access token
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: './schemas.yaml#/ClientMetadata'}
    responses:
      '201':
        description: The client.
        content:
          application/json:
            schema:
              allOf:
                - {$ref: './schemas.yaml#/ClientMetadata'}
                - type: object
                  required: [client_id, client_id_issued_at, client_secret_expires_at]
                  properties:
                    client_id: {type: string}
                    client_secret: {type: string}
                    client_id_issued_at: {type: integer}
                    client_secret_expires_at: {type: integer}
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
/oauth2/userinfo:
  get:
    operationId: userinfo
    tags: [oauth2]
    summary: The signed-in user's claims (OpenID Connect Core §5.3)
    responses:
      '200':
        $ref: '../common.yaml#/ClaimsResponse'
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
  post:
    operationId: userinfoByForm
    tags: [oauth2]
    summary: The signed-in user's claims, the token posted
    responses:
      '200':
        $ref: '../common.yaml#/ClaimsResponse'
      default:
        $ref: '../common.yaml#/OAuthErrorResponse'
/oauth2/logout:
  get:
    operationId: logout
    tags: [oauth2]
    summary: Sign out (RP-Initiated Logout)
    parameters:
      - {name: id_token_hint, in: query, required: false, schema: {type: string}}
      - {name: client_id, in: query, required: false, schema: {type: string}}
      - {name: post_logout_redirect_uri, in: query, required: false, schema: {type: string}}
      - {name: state, in: query, required: false, schema: {type: string}}
      - {name: logout_hint, in: query, required: false, schema: {type: string}}
      - {name: ui_locales, in: query, required: false, schema: {type: string}}
    responses:
      '302':
        $ref: '../common.yaml#/RedirectResponse'
  post:
    operationId: logoutByForm
    tags: [oauth2]
    summary: Sign out, the parameters posted
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema: {type: object, additionalProperties: {type: string}}
    responses:
      '302':
        $ref: '../common.yaml#/RedirectResponse'
