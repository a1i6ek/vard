/api/v1/account/password:
  post:
    operationId: postAccountPassword
    tags:
    - password
    summary: Post password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              current_password:
                type: string
              new_password:
                type: string
            required:
            - current_password
            - new_password
            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                status:
                  type: string
              required:
              - status
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
