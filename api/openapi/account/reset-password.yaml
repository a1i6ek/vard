/api/v1/account/reset-password:
  get:
    operationId: listAccountResetPassword
    tags:
    - reset-password
    summary: Read reset-password
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                valid:
                  type: boolean
              required:
              - valid
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  post:
    operationId: postAccountResetPassword
    tags:
    - reset-password
    summary: Post reset-password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              password:
                type: string
              token:
                type: string
            required:
            - token
            - password
            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                status:
                  type: string
              required:
              - status
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
