            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RecoveryCodes
      default:
        $ref: ../common.yaml#/ProblemResponse
/api/v1/account/two-step/factors/{id}:
  delete:
    operationId: deleteAccountTwoStepFactors
    tags:
    - two-step
    summary: Delete two-step/factors/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              current_password: {}
            required:
            - current_password
            type: object
    responses:
      '204':
        description: Done.
      default:
        $ref: ../common.yaml#/ProblemResponse
