/api/v1/account/two-step:
  get:
    operationId: listAccountTwoStep
    tags:
    - two-step
    summary: Read two-step
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                two_step:
                  $ref: ./schemas.yaml#/TwoStep
              required:
              - two_step
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
/api/v1/account/two-step/authenticator:
  post:
    operationId: postAccountTwoStepAuthenticator
    tags:
    - two-step
    summary: Post two-step/authenticator
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              current_password: {}
            required:
            - current_password
            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                authenticator:
                  $ref: ./schemas.yaml#/AuthenticatorSecret
              required:
              - authenticator
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
/api/v1/account/two-step/authenticator/confirm:
  post:
    operationId: postAccountTwoStepAuthenticatorConfirm
    tags:
    - two-step
    summary: Post two-step/authenticator/confirm
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              cod: {}
