/api/v1/admin/apis:
  get:
    operationId: listAdminApis
    tags:
    - apis
    summary: List apis
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              type: object
              properties:
                apis:
                  type: array
                  items:
                    $ref: ./schemas.yaml#/API
                total:
                  type: number
              required:
              - apis
              - total
      default:
        $ref: ../common.yaml#/ProblemResponse
  post:
    operationId: postAdminApis
    tags:
    - apis
    summary: Post apis
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/APIInput
    responses:
      '201':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                api:
                  $ref: ./schemas.yaml#/API
              required:
              - api
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
/api/v1/admin/apis/{id}:
  get:
    operationId: getAdminApis
    tags:
    - apis
    summary: Read apis/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                api:
                  $ref: ./schemas.yaml#/API
              required:
              - api
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  patch:
    operationId: updateAdminApis
    tags:
    - apis
    summary: Update apis/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/APIInput
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                api:
                  $ref: ./schemas.yaml#/API
              required:
              - api
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  delete:
    operationId: deleteAdminApis
    tags:
    - apis
    summary: Delete apis/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Done.
      default:
        $ref: ../common.yaml#/ProblemResponse
