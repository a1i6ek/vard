  - require_pushed_authorization_requests
  - require_role_assignment
  - scopes
  - terms_url
  - token_auth_method
  - website_url
  type: object
ApplicationPage:
  additionalProperties: false
  properties:
    applications:
      items:
        $ref: '#/Application'
      type: array
    limit:
      type: number
    offset:
      type: number
    total:
      type: number
  required:
  - applications
  - total
  - limit
  - offset
  type: object
ApplicationProfile:
  description: 'The kind of client an application is (ADR 0005): it decides what the application may use.'
  enum:
  - web
  - spa
  - native
  - desktop
  - machine
  type: string
ApplicationRoles:
  allOf:
  - $ref: '#/HeldRoles'
  - type: object
    properties:
      id:
        type: string
      client_id:
        type: string
      name:
        type: string
    required:
    - id
    - client_id
    - name
ApplicationWithSecret:
  additionalProperties: false
  properties:
    application:
      $ref: '#/Application'
    client_secret:
      type: string
  required:
  - application
  type: object
AttestationConveyancePreference:
  enum:
  - direct
  - enterprise
  - indirect
  - none
  type: string
AttestationFormat:
  description: 'Values for an attestation object''s `fmt`


    See https://www.iana.org/assignments/webauthn/webauthn.xhtml#webauthn-attestation-statement-format-ids'
  enum:
  - fido-u2f
  - packed
  - android-safetynet
  - android-key
  - tpm
  - apple
  - none
  type: string
AuthMethod:
  enum:
  - client_secret_basic
  - client_secret_post
  - private_key_jwt
  - none
  type: string
AuthenticationExtensionsClientInputs:
  additionalProperties: false
  properties:
    appid:
      type: string
    credProps:
      type: boolean
    hmacCreateSecret:
      type: boolean
    minPinLength:
      type: boolean
  type: object
  description: The WebAuthn extensions this server asks for; it asks for no prf.
AuthenticationExtensionsClientOutputs:
  additionalProperties: false
  properties:
    appid:
      type: boolean
    credProps:
      $ref: '#/CredentialPropertiesOutput'
    hmacCreateSecret:
      type: boolean
  type: object
  description: The WebAuthn extensions' results this server reads; it reads no prf.
AuthenticatorAttachment:
  enum:
  - cross-platform
  - platform
  type: string
AuthenticatorAttestationResponseJSON:
  additionalProperties: false
  description: 'A slightly-modified AuthenticatorAttestationResponse to simplify working with ArrayBuffers
    that are Base64URL-encoded in the browser so that they can be sent as JSON to the server.


    https://w3c.github.io/webauthn/#dictdef-authenticatorattestationresponsejson'
  properties:
    attestationObject:
      $ref: '#/Base64URLString'
    authenticatorData:
      $ref: '#/Base64URLString'
    clientDataJSON:
      $ref: '#/Base64URLString'
    publicKey:
      $ref: '#/Base64URLString'
    publicKeyAlgorithm:
      $ref: '#/COSEAlgorithmIdentifier'
    transports:
      items:
        type: string
      type: array
  required:
  - clientDataJSON
  - attestationObject
  type: object
AuthenticatorSelectionCriteria:
  additionalProperties: false
  properties:
    authenticatorAttachment:
      $ref: '#/AuthenticatorAttachment'
    requireResidentKey:
      type: boolean
    residentKey:
      $ref: '#/ResidentKeyRequirement'
    userVerification:
      $ref: '#/UserVerificationRequirement'
  type: object
Base64URLString:
  type: string
COSEAlgorithmIdentifier:
  type: number
CredentialPropertiesOutput:
  additionalProperties: false
  properties:
    rk:
      type: boolean
  type: object
FieldInput:
  additionalProperties: false
  properties:
    is_required:
      type: boolean
    is_unique:
      type: boolean
    label:
      type: string
    max:
      type:
      - number
      - 'null'
    min:
      type:
      - number
      - 'null'
    name:
