API:
  additionalProperties: false
  properties:
    allow_offline_access:
      type: boolean
    application_count:
      type: number
    created_at:
      type: string
    description:
      type: string
    enforce_roles:
      type: boolean
    id:
      type: string
    identifier:
      type: string
    issuer:
      type: string
    jwks_uri:
      type: string
    name:
      type: string
    role_count:
      type: number
    scopes:
      items:
        $ref: '#/APIScope'
      type: array
    signing_algorithm:
      $ref: '#/SigningAlgorithm'
    system:
      enum:
      - ''
      - admin
      - account
      type: string
    token_lifetime:
      type: number
    updated_at:
      type: string
  required:
  - id
  - name
  - identifier
  - description
  - enforce_roles
  - scopes
  - signing_algorithm
  - token_lifetime
  - allow_offline_access
  - application_count
  - role_count
  - issuer
  - jwks_uri
  - system
  - created_at
  - updated_at
  type: object
APIAccess:
  additionalProperties: false
  properties:
    authorized:
      type: boolean
    enforce_roles:
      type: boolean
    id:
      type: string
    identifier:
      type: string
    name:
      type: string
    scopes:
      items:
        additionalProperties: false
        properties:
          allowed:
            type: boolean
          description:
            type: string
          id:
            type: string
          is_default:
            type: boolean
          name:
            type: string
        required:
        - allowed
        - description
        - id
        - is_default
        - name
        type: object
      type: array
  required:
  - id
  - name
  - identifier
  - enforce_roles
  - authorized
  - scopes
  type: object
APIApplication:
  additionalProperties: false
  properties:
    allowed:
      items:
        type: string
      type: array
    authorized:
      type: boolean
    client_id:
      type: string
    id:
      type: string
    is_enabled:
      type: boolean
    name:
      type: string
    profile:
      $ref: '#/ApplicationProfile'
  required:
  - id
  - name
  - profile
  - client_id
  - is_enabled
  - authorized
  - allowed
  type: object
APIExchangeRule:
  additionalProperties: false
  description: A rule letting one application exchange another's tokens for an API's (RFC 8693), acting
    for their subject, with at most these scopes.
  properties:
    application_id:
      type: string
    scopes:
      items:
        type: string
      type: array
    subject_application_id:
      type: string
  required:
  - application_id
  - subject_application_id
  - scopes
  type: object
APIInput:
  additionalProperties: false
  properties:
    allow_offline_access:
      type: boolean
    description:
      type: string
    enforce_roles:
      type: boolean
    identifier:
      type: string
    name:
      type: string
    scopes:
      items:
        additionalProperties: false
        properties:
          description:
            type: string
          id:
            type: string
          is_default:
            type: boolean
          name:
            type: string
        required:
        - name
        - description
        - is_default
        type: object
      type: array
    signing_algorithm:
      $ref: '#/SigningAlgorithm'
    token_lifetime:
      type: number
  required:
  - name
  - identifier
  - description
  - enforce_roles
  - signing_algorithm
  - token_lifetime
  - allow_offline_access
  - scopes
  type: object
APIIntrospector:
  additionalProperties: false
  description: An application, and whether it may introspect an API's access tokens whichever client they
    were issued to. Only a confidential one may.
  properties:
    client_id:
      type: string
    confidential:
      type: boolean
    id:
      type: string
    listed:
      type: boolean
    name:
      type: string
    profile:
      $ref: '#/ApplicationProfile'
  required:
  - id
  - name
  - profile
  - client_id
  - confidential
  - listed
  type: object
APILogEntry:
  additionalProperties: false
  properties:
    action:
      type: string
    actor:
      type: string
    created_at:
      type: string
    id:
      type: string
    ip:
      type: string
    metadata:
      anyOf:
      - additionalProperties: {}
        type: object
      - type: 'null'
  required:
  - id
  - action
  - actor
  - ip
  - metadata
  - created_at
  type: object
APIScope:
  additionalProperties: false
  properties:
    description:
      type: string
    id:
      type: string
    is_default:
      type: boolean
    name:
      type: string
  required:
  - id
  - name
  - description
  - is_default
  type: object
APIScopeRef:
  additionalProperties: false
  properties:
    api_id:
      type: string
    id:
      type: string
    name:
      type: string
  required:
  - id
  - name
  - api_id
  type: object
ActivityEvent:
  additionalProperties: false
  properties:
    action:
      type: string
    actor:
      type: string
    created_at:
      type: string
    detail:
      type: string
    id:
      type: string
    ip:
      type: string
    target:
      anyOf:
      - $ref: '#/ActivityTarget'
      - type: 'null'
  required:
  - id
  - action
  - actor
  - ip
  - target
  - created_at
  type: object
ActivityTarget:
  additionalProperties: false
  properties:
    id:
      type: string
    name:
      type: string
    type:
      type: string
  required:
  - type
  - id
  type: object
Admin:
  additionalProperties: false
  description: The shapes the API returns. They mirror the response.go files under api/; change them together.
  properties:
    avatar_url:
      type: string
    email:
      type: string
    first_name:
      type: string
    full_name:
      type: string
    id:
      type: string
    is_super_admin:
      type: boolean
    last_login_at:
      type: string
    last_name:
      type: string
    mfa_enabled:
      type: boolean
    permissions:
      description: What the whole-panel roles allow. The panel shows and hides its controls by these;
        the server checks them regardless.
      items:
        $ref: '#/AdminPermissionName'
      type: array
    roles:
      items:
        type: string
      type: array
    scoped_permissions:
      additionalProperties:
        items:
          $ref: '#/AdminPermissionName'
        type: array
      type: object
    status:
      type: string
    username:
      type: string
  required:
  - id
  - username
  - email
  - full_name
  - first_name
  - last_name
  - avatar_url
  - status
  - roles
  - permissions
  - scoped_permissions
  - is_super_admin
  - mfa_enabled
  type: object
AdminAssignment:
  additionalProperties: false
  properties:
    application:
      anyOf:
      - $ref: '#/Reference'
      - type: 'null'
    id:
      type: string
    role:
      $ref: '#/Reference'
  required:
  - id
  - role
  - application
  type: object
AdminAssignmentInput:
  additionalProperties: false
  properties:
    application_id:
      type:
      - string
      - 'null'
    role_id:
      type: string
  required:
  - role_id
  - application_id
  type: object
AdminInput:
  additionalProperties: false
  properties:
    assignments:
      items:
        $ref: '#/AdminAssignmentInput'
      type: array
    confirm_password:
      type: string
    email:
      type: string
    first_name:
      type: string
    last_name:
      type: string
    password:
      type: string
    status:
      enum:
      - active
      - suspended
      - disabled
      type: string
  required:
  - email
  - first_name
  - last_name
  - status
  - assignments
  type: object
AdminPage:
  additionalProperties: false
  properties:
    admins:
      items:
        $ref: '#/AdminRecord'
      type: array
    limit:
      type: number
    offset:
      type: number
    total:
      type: number
  required:
  - admins
  - total
  - limit
  - offset
  type: object
AdminPasskey:
  additionalProperties: false
  properties:
    added_at:
      type: string
    id:
      type: string
    label:
      type: string
    last_used_at:
      type:
      - string
      - 'null'
  required:
  - id
  - label
  - added_at
  - last_used_at
  type: object
AdminPermission:
  additionalProperties: false
  properties:
    description:
      type: string
    group:
      type: string
    name:
      $ref: '#/AdminPermissionName'
    scopable:
      type: boolean
  required:
  - name
  - group
  - description
  - scopable
  type: object
AdminPermissionName:
  description: The names in the admin permission catalog. They mirror the constants in core/model/admin_permission.go;
    change them together.
  enum:
  - activity.read
  - users.read
  - users.write
  - user_fields.write
  - apis.read
  - apis.write
  - organization.read
  - organization.write
  - social.read
  - social.write
  - login_flows.read
  - login_flows.write
  - sso.read
  - sso.write
  - languages.read
  - languages.write
  - applications.read
  - applications.write
  - user_roles.write
  - role_assignments.write
  type: string
AdminRecord:
  additionalProperties: false
  properties:
    assignments:
      items:
        $ref: '#/AdminAssignment'
      type: array
    created_at:
      type: string
    email:
      type: string
    first_name:
      type: string
    full_name:
      type: string
    id:
      type: string
    is_super_admin:
      type: boolean
    last_login_at:
      type:
      - string
      - 'null'
    last_login_ip:
      type: string
    last_name:
      type: string
    mfa_enabled:
      type: boolean
    permissions:
      items:
        $ref: '#/AdminPermissionName'
      type: array
    scoped_permissions:
      additionalProperties:
        items:
          $ref: '#/AdminPermissionName'
        type: array
      type: object
    status:
      $ref: '#/AdminStatus'
    updated_at:
      type: string
    username:
      type: string
  required:
  - id
  - username
  - email
  - first_name
  - last_name
  - full_name
  - status
  - assignments
  - permissions
  - scoped_permissions
  - is_super_admin
  - mfa_enabled
  - last_login_at
  - last_login_ip
  - created_at
  - updated_at
  type: object
AdminRole:
  additionalProperties: false
  properties:
    admin_count:
      type: number
    created_at:
      type: string
    description:
      type: string
    id:
      type: string
    is_builtin:
      type: boolean
    name:
      type: string
    permissions:
      items:
        $ref: '#/AdminPermissionName'
      type: array
    updated_at:
      type: string
  required:
  - id
  - name
  - description
  - permissions
  - is_builtin
  - admin_count
  - created_at
  - updated_at
  type: object
AdminRoleInput:
  additionalProperties: false
  properties:
    description:
      type: string
    name:
      type: string
    permissions:
      items:
        $ref: '#/AdminPermissionName'
      type: array
  required:
  - name
  - description
  - permissions
  type: object
AdminSecurity:
  additionalProperties: false
  properties:
    administrators:
      type: number
    idle_timeout_minutes:
      description: An unused session ends after this many minutes, within its twelve hours.
      type: number
    require_mfa:
      type: boolean
    with_mfa:
      type: number
  required:
  - require_mfa
  - idle_timeout_minutes
  - administrators
  - with_mfa
  type: object
AdminSession:
  additionalProperties: false
  properties:
    active:
      type: boolean
    created_at:
      type: string
    current:
      type: boolean
    expires_at:
      type: string
    id:
      type: string
    ip:
      type: string
    user_agent:
      type: string
  required:
  - id
  - ip
  - user_agent
  - created_at
  - expires_at
  - active
  - current
  type: object
AdminStatus:
  enum:
  - active
  - suspended
  - disabled
  - invited
  type: string
AndroidApp:
  additionalProperties: false
  properties:
    package_name:
      type: string
    sha256_cert_fingerprints:
      items:
        type: string
      type: array
  required:
  - package_name
  - sha256_cert_fingerprints
  type: object
Application:
  additionalProperties: false
  properties:
    access_token_lifetime:
      type: number
    allow_development_redirects:
      description: A native app in development may register Expo Go's exp:// addresses.
      type: boolean
    allow_registration:
      type: boolean
    android_apps:
      description: A mobile app's Android packages, with their signing certificates' SHA-256 fingerprints.
      items:
        $ref: '#/AndroidApp'
      type: array
    assert_roles:
      type: boolean
    backchannel_logout_uri:
      description: Where the server posts a logout token when a session the application signed someone
        in through ends; empty, it is not told.
      type: string
    client_id:
      type: string
    client_id_issued_at:
      type: number
    created_at:
      type: string
    description:
      type: string
    dpop_bound_access_tokens:
      description: Every token request must carry a DPoP proof; always on for an SPA or a mobile app.
      type: boolean
    grant_types:
      items:
        $ref: '#/GrantType'
      type: array
    has_secret:
      type: boolean
    id:
      type: string
    id_token_lifetime:
      type: number
    id_token_signed_response_alg:
      description: What its ID tokens and logout tokens are signed with.
      enum:
      - RS256
      - PS256
      - ES256
      type: string
    ios_app_ids:
      description: A mobile app's iOS app IDs (TEAMID.bundle.id), for its passkeys.
      items:
        type: string
      type: array
    is_enabled:
      type: boolean
    issuer:
      type: string
      format: uri
      description: What the application is configured with to find this server; its discovery document
        is at <issuer>/.well-known/openid-configuration.
    jwks:
      anyOf:
      - $ref: '#/JsonWebKeySet'
      - type: 'null'
      description: A private_key_jwt client's public keys, inline; null without any.
    jwks_uri:
      description: Or where it publishes them.
      type: string
    login_flow_id:
      type:
      - string
      - 'null'
    logo_url:
      type: string
    name:
      type: string
    post_logout_redirect_uris:
      items:
        type: string
      type: array
    previous_secret_until:
      description: When the secret the last rotation replaced stops working; null once it has.
      type:
      - string
      - 'null'
    privacy_url:
      type: string
    profile:
      $ref: '#/ApplicationProfile'
    redirect_uris:
      items:
        type: string
      type: array
    refresh_token_idle_lifetime:
      description: Ends a refresh family unused for this long, in seconds.
      type: number
    refresh_token_lifetime:
      type: number
    require_pushed_authorization_requests:
      description: Authorization requests must be pushed first (RFC 9126).
      type: boolean
    require_role_assignment:
      type: boolean
    response_types:
      items:
        type: string
      type: array
    role_count:
      type: number
    scopes:
      items:
        $ref: '#/Scope'
      type: array
    secret_created_at:
      type:
      - string
      - 'null'
    secret_hint:
      type: string
    terms_url:
      type: string
    token_auth_method:
      $ref: '#/AuthMethod'
    updated_at:
      type: string
    website_url:
      type: string
  required:
  - id
  - name
  - description
  - profile
  - logo_url
  - website_url
  - privacy_url
  - terms_url
  - client_id
  - client_id_issued_at
  - has_secret
  - secret_hint
  - secret_created_at
  - previous_secret_until
  - token_auth_method
  - grant_types
  - response_types
  - redirect_uris
  - post_logout_redirect_uris
  - allow_development_redirects
  - ios_app_ids
  - android_apps
  - backchannel_logout_uri
  - jwks
  - jwks_uri
  - id_token_signed_response_alg
  - dpop_bound_access_tokens
  - scopes
  - require_pushed_authorization_requests
  - access_token_lifetime
  - id_token_lifetime
  - refresh_token_lifetime
  - refresh_token_idle_lifetime
  - assert_roles
  - require_role_assignment
  - is_enabled
  - allow_registration
  - login_flow_id
  - role_count
  - created_at
  - updated_at
  - issuer
  type: object
