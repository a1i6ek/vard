/api/v1/admin/security:
  get:
    operationId: listAdminSecurity
    tags:
    - security
    summary: Read security
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AdminSecurity
      default:
        $ref: ../common.yaml#/ProblemResponse
  patch:
    operationId: updateAdminSecurity
    tags:
    - security
    summary: Update security
    requestBody:
      required: true
      content:
        application/json:
          schema:
            additionalProperties: false
            properties:
              idle_timeout_minutes:
                type: number
              require_mfa:
                type: boolean
            type: object
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AdminSecurity
      default:
        $ref: ../common.yaml#/ProblemResponse
