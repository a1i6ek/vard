/api/v1/admin/sso-connections:
  get:
    operationId: listAdminSsoConnections
    tags:
    - sso-connections
    summary: List sso-connections
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                connections:
                  items:
                    $ref: ./schemas.yaml#/SSOConnection
                  type: array
              required:
              - connections
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  post:
    operationId: postAdminSsoConnections
    tags:
    - sso-connections
    summary: Post sso-connections
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/SSOConnectionInput
    responses:
      '201':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                connection:
                  $ref: ./schemas.yaml#/SSOConnection
              required:
              - connection
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
