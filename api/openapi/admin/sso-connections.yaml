    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                connection:
                  $ref: ./schemas.yaml#/SSOConnection
              required:
              - connection
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  patch:
    operationId: updateAdminSsoConnections
    tags:
    - sso-connections
    summary: Update sso-connections/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/SSOConnectionInput
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                connection:
                  $ref: ./schemas.yaml#/SSOConnection
              required:
              - connection
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  delete:
    operationId: deleteAdminSsoConnections
    tags:
    - sso-connections
    summary: Delete sso-connections/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Done.
      default:
        $ref: ../common.yaml#/ProblemResponse
