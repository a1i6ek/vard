/api/v1/admin/users:
  get:
    operationId: listAdminUsers
    tags:
    - users
    summary: List users
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/UserPage
      default:
        $ref: ../common.yaml#/ProblemResponse
  post:
    operationId: postAdminUsers
    tags:
    - users
    summary: Post users
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/UserInput
    responses:
      '201':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                user:
                  $ref: ./schemas.yaml#/UserRecord
              required:
              - user
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
/api/v1/admin/users/{id}:
  get:
    operationId: getAdminUsers
    tags:
    - users
    summary: Read users/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                user:
                  $ref: ./schemas.yaml#/UserRecord
              required:
              - user
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  patch:
    operationId: updateAdminUsers
    tags:
    - users
    summary: Update users/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/UserInput
    responses:
      '200':
        description: Done.
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                user:
                  $ref: ./schemas.yaml#/UserRecord
              required:
              - user
              type: object
      default:
        $ref: ../common.yaml#/ProblemResponse
  delete:
    operationId: deleteAdminUsers
    tags:
    - users
    summary: Delete users/{id}
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Done.
      default:
        $ref: ../common.yaml#/ProblemResponse
