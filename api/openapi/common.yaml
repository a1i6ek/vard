OAuthError:
  type: object
  description: An OAuth endpoint's error (RFC 6749 §5.2).
  required:
  - error
  properties:
    error:
      type: string
    error_description:
      type: string
ProblemResponse:
  description: A problem.
  content:
    application/problem+json:
      schema:
        $ref: '#/Problem'
OAuthErrorResponse:
  description: An OAuth error.
  content:
    application/json:
      schema:
        $ref: '#/OAuthError'
RedirectResponse:
  description: Sent on, to the address in Location.
  headers:
    Location:
      schema:
        type: string
ClaimsResponse:
  description: The user's claims, as the token's scopes allow.
  content:
    application/json:
      schema:
        type: object
        required:
        - sub
        properties:
          sub:
            type: string
        additionalProperties: true
KeySetResponse:
  description: A JSON Web Key Set (RFC 7517), public keys only.
  content:
    application/json:
      schema:
        type: object
        required:
        - keys
        properties:
          keys:
            type: array
            items:
              type: object
              required:
              - kty
              properties:
                kty:
                  type: string
                kid:
                  type: string
                alg:
                  type: string
                use:
                  type: string
              additionalProperties: true
SlugParameter:
  name: slug
  in: path
  required: true
  schema:
    type: string
