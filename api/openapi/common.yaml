Problem:
  type: object
  description: An error, as problem details (RFC 9457).
  required:
  - type
  - title
  - status
  - detail
  properties:
    type:
      type: string
      description: <issuer>/problems/<code>, or about:blank for a sentence with no code.
    title:
      type: string
      description: The status, in words.
    status:
      type: integer
    detail:
      type: string
      description: The English sentence.
    code:
      $ref: '#/ProblemCode'
    params:
      type: object
      additionalProperties:
        type:
        - string
        - number
      description: What the sentence names, for an app to say it in the reader's language.
